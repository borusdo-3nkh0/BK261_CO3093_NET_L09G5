name: P1 protocol and UDP

on:
  push:
    branches: [main]
    paths: ['A1_Client-Server/**', '.github/workflows/p1.yml']
  pull_request:
    paths: ['A1_Client-Server/**', '.github/workflows/p1.yml']

permissions:
  contents: read

concurrency:
  group: p1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    defaults:
      run:
        working-directory: A1_Client-Server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        run: python -m pip install "pytest==8.4.2" "cryptography==44.0.3"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -m compileall -q shared p1 tests