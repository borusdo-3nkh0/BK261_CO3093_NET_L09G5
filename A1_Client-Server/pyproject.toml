# Dependency groups and tooling only; no build backend or distributable package.
[dependency-groups]
security = ["cryptography==50.0.2"]
dev = [
    { include-group = "security" },
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers -m 'not large and not load'"
markers = ["large: opt-in 32/256 MiB file checks", "load: opt-in multi-client/file checks"]
junit_family = "xunit1"

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
